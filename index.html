<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V Link - Dashboard</title>
  <style>
    body { font-family: Arial; margin:0; background:#f0f2f5; }
    header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#4facfe; color:white; }
    header h1 { margin:0; font-size:1.8em; cursor:pointer; }
    #profile { cursor:pointer; position:relative; }
    #historyModal { display:none; position:absolute; top:40px; right:0; background:white; color:black; border:1px solid #ccc; padding:15px; border-radius:8px; width:300px; max-height:400px; overflow-y:auto; z-index:100; }
    main { padding:20px; }
    .news-popup { background:#fff; border:1px solid #ccc; padding:15px; border-radius:8px; margin-bottom:20px; }
    .news-boxes { display:flex; flex-wrap:wrap; gap:15px; }
    .news-box { background:white; border:1px solid #ccc; padding:15px; border-radius:8px; width:200px; }
    #donateBtn { position:fixed; bottom:20px; right:20px; background:#007bff; color:white; padding:15px 20px; border:none; border-radius:50px; cursor:pointer; font-weight:bold; box-shadow:0 4px 6px rgba(0,0,0,0.2); }
    .donation-card { border:1px solid #ccc; border-radius:8px; padding:15px; margin:10px 0; background:white; }
    .accept { background:#4CAF50;color:white; margin-right:5px; }
    .decline { background:#f44336;color:white; }
    .status { font-weight:bold; }
    .available { color:green; }
    .pending { color:orange; }
    .closed { color:gray; }
  </style>
</head>
<body>

<header>
  <h1>V Link 🌍</h1>
  <div id="profile">Profile ▼
    <div id="historyModal"></div>
  </div>
</header>

<main>
  <div id="mainContent"></div>
</main>

<button id="donateBtn">Donate 🍱</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, query, where, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUegWQrrwgo170yFx68ZcFx7r8TPSujYU",
  authDomain: "v-link-bc049.firebaseapp.com",
  projectId: "v-link-bc049",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;
let userRole;
let userArea;

const profileDiv = document.getElementById("profile");
const historyModal = document.getElementById("historyModal");
const mainContent = document.getElementById("mainContent");
const donateBtn = document.getElementById("donateBtn");

profileDiv.onclick = () => {
  historyModal.style.display = historyModal.style.display === "block" ? "none" : "block";
};

onAuthStateChanged(auth, async user => {
  if(!user){ window.location.href="login.html"; return; }
  currentUser = user;

  const userDoc = await getDoc(doc(db,"users",user.uid));
  if(userDoc.exists()){
    userRole = userDoc.data().role;
    userArea = userDoc.data().area ? userDoc.data().area.toLowerCase() : "";
  }

  if(userRole === "donor"){
    donateBtn.style.display="block";
    loadDonorHistory();
    loadNews();
  } else if(userRole === "ngo"){
    donateBtn.style.display="none";
    loadNGODonations();
  }
});

function loadDonorHistory(){
  const q = query(collection(db,"donations"), where("donorId","==",currentUser.uid));
  onSnapshot(q,snapshot=>{
    historyModal.innerHTML="<h3>Donation History</h3>";
    snapshot.forEach(docSnap=>{
      const d = docSnap.data();
      historyModal.innerHTML+=`
        <div class="donation-card">
          <p><b>${d.foodName}</b> (${d.foodType})</p>
          <p>Servings: ${d.servings}</p>
          <p>Status: <span class="status ${d.status}">${d.status}</span></p>
        </div>
      `;
    });
  });
}

function loadNews(){
  mainContent.innerHTML = `
    <div class="news-popup">
      <h3>Latest Campaign!</h3>
      <p>Check out upcoming NGO events and community drives.</p>
    </div>
    <div class="news-boxes">
      <div class="news-box"><b>NGO A:</b> Food Camp on Sat</div>
      <div class="news-box"><b>NGO B:</b> Clothes Drive</div>
      <div class="news-box"><b>Company C:</b> Donation Matching Program</div>
    </div>
  `;
}

function loadNGODonations(){
  const q = query(collection(db,"donations"), where("status","==","available"), where("area","==",userArea));
  onSnapshot(q,snapshot=>{
    mainContent.innerHTML="<h2>Available Donations in Your Area</h2>";
    snapshot.forEach(docSnap=>{
      const d = docSnap.data();
      const id = docSnap.id;
      mainContent.innerHTML+=`
        <div class="donation-card">
          <p><b>${d.foodName}</b> (${d.foodType})</p>
          <p>Servings: ${d.servings}</p>
          <p>Time: ${d.timePrep}</p>
          <p>Area: ${d.area}</p>
          <button class="accept" onclick="acceptDonation('${id}')">Accept</button>
          <button class="decline" onclick="declineDonation('${id}')">Decline</button>
        </div>
      `;
    });
  });
}

window.acceptDonation = async function(id){
  await updateDoc(doc(db,"donations",id),{status:"pending"});
  alert("Donation accepted ✅");
}

window.declineDonation = async function(id){
  await updateDoc(doc(db,"donations",id),{status:"closed"});
  alert("Donation declined ❌");
}

donateBtn.onclick = () => { window.location.href="donor.html"; }
</script>
</body>
</html>
