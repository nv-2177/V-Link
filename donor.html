<!DOCTYPE html>
<html>
<head>
  <title>Donor Dashboard - V Link</title>
  <style>
    body { font-family:Arial; padding:20px; background:#f0f2f5; }
    h2 { color:#333; }
    input, select, button { padding:10px; margin:5px 0; width:250px; border-radius:5px; border:1px solid #ccc; }
    button { width:260px; background:#4CAF50; color:white; border:none; cursor:pointer; }
    button:hover { background:#45a049; }
    .donation-card { border:1px solid #ccc; border-radius:8px; padding:15px; margin:10px; width:300px; background:white; }
    .status { font-weight:bold; }
    .available { color:green; }
    .pending { color:orange; }
    .closed { color:gray; }
  </style>
</head>
<body>

<h2>Donate Food 🍱</h2>

<label>Food Type:</label>
<select id="foodType">
  <option value="Veg">Veg</option>
  <option value="Non-Veg">Non-Veg</option>
</select><br>

<label>Food Name:</label>
<input type="text" id="foodName" placeholder="Enter food name"><br>

<label>Servings:</label>
<input type="number" id="servings" placeholder="Enter number of servings"><br>

<label>Preparation Time:</label>
<input type="time" id="timePrep"><br>

<label>Area / City:</label>
<input type="text" id="donorArea" placeholder="Enter your city / area"><br>

<button onclick="submitDonation()">Confirm Donation</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUegWQrrwgo170yFx68ZcFx7r8TPSujYU",
  authDomain: "v-link-bc049.firebaseapp.com",
  projectId: "v-link-bc049",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;

onAuthStateChanged(auth,user=>{
  if(!user) window.location.href="login.html";
  else currentUser=user;
});

window.submitDonation = async function(){
  const foodType = document.getElementById("foodType").value;
  const foodName = document.getElementById("foodName").value.trim();
  const servings = document.getElementById("servings").value;
  const timePrep = document.getElementById("timePrep").value;
  const donorArea = document.getElementById("donorArea").value.trim().toLowerCase();

  if(!foodName || !servings || !timePrep || !donorArea){ alert("Please fill all fields"); return; }

  try{
    await addDoc(collection(db,"donations"),{
      donorId: currentUser.uid,
      foodType,
      foodName,
      servings: Number(servings),
      timePrep,
      area: donorArea,
      status: "available",
      createdAt: serverTimestamp()
    });

    alert("Donation Submitted Successfully 🎉");
    document.getElementById("foodName").value="";
    document.getElementById("servings").value="";
    document.getElementById("timePrep").value="";

    // Redirect back to index after submission
    window.location.href="index.html";

  }catch(error){ alert(error.message); }
}
</script>
</body>
</html>
