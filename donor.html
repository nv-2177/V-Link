<!DOCTYPE html>
<html>
<head>
    <title>Donate Food - V Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fdfdfd; margin: 0; color: #333; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; border-bottom: 1px solid #eee; }
        .nav-logo { display: flex; align-items: center; font-size: 22px; font-weight: 800; color: #1a1a1a; gap: 8px; }
        .nav-logo span { color: #38a169; }
        .main-content { display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; padding: 40px; width: 100%; max-width: 600px; border-radius: 16px; border: 1px solid #edf2f7; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #4a5568; }
        input, select { width: 100%; padding: 14px 16px; border-radius: 8px; border: 1px solid #e2e8f0; background-color: #f8fafc; font-size: 15px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 14px; background: #38a169; color: white; font-weight: 700; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #2f855a; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo"><span>💚</span> V-Link</div>
        <button onclick="window.location.href='index.html'" style="border:none; background:none; cursor:pointer; color:#38a169; font-weight:600;">← Back</button>
    </nav>
    <div class="main-content">
        <div class="card">
            <h2>🥗 Donate Food</h2>
            <div class="form-group">
                <label>Food Category *</label>
                <select id="foodType"><option value="Veg">Veg</option><option value="Non-Veg">Non-Veg</option></select>
            </div>
            <div class="form-group"><label>Food Name *</label><input type="text" id="foodName" placeholder="e.g., Rice, Bread"></div>
            <div class="form-group"><label>Quantity (servings) *</label><input type="number" id="servings" placeholder="e.g., 50"></div>
            <div class="form-group"><label>Location (area/city) *</label><input type="text" id="donorArea" placeholder="e.g., Downtown"></div>
            <div class="form-group"><label>Pickup Time (optional)</label><input type="time" id="timePrep"></div>
            <button class="btn-submit" onclick="submitDonation()">Submit Donation</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBUegWQrrwgo170yFx68ZcFx7r8TPSujYU", authDomain: "v-link-bc049.firebaseapp.com", projectId: "v-link-bc049" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let uid;
        onAuthStateChanged(auth, user => { if (!user) window.location.href = "login.html"; else uid = user.uid; });

        window.submitDonation = async () => {
            const foodName = document.getElementById("foodName").value.trim();
            const servings = document.getElementById("servings").value;
            const donorArea = document.getElementById("donorArea").value.trim().toLowerCase();
            if (!foodName || !servings || !donorArea) return alert("Fill required fields.");
            try {
                await addDoc(collection(db, "donations"), {
                    donorId: uid, foodType: document.getElementById("foodType").value, foodName,
                    servings: Number(servings), timePrep: document.getElementById("timePrep").value,
                    area: donorArea, status: "available", createdAt: serverTimestamp()
                });
                alert("Donation Submitted 🎉");
                window.location.href = "index.html";
            } catch (error) { alert(error.message); }
        }
    </script>
</body>
</html>
